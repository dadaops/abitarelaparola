name: Pubblica via SFTP/FTP

# Spento finché la variabile del repo SFTP_ENABLED non vale "true" (deve essere una variabile,
# non un secret: GitHub non legge i secret nella condizione del job). Gli altri valori sono
# letti sia dalle variabili sia dai secret.
# SFTP_PROTOCOL sceglie il protocollo: sftp (predefinito), ftps o ftp.
# Configurazione richiesta: vedi README.md, sezione «Pubblicazione su Tophost».
# Il caricamento è in scripts/pubblica-ftp.sh, condiviso con prova-modulo.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sftp
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SFTP_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
      SFTP_PROTOCOL: ${{ vars.SFTP_PROTOCOL || secrets.SFTP_PROTOCOL || 'sftp' }}
      SFTP_HOST: ${{ vars.SFTP_HOST || secrets.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT || secrets.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER || secrets.SFTP_USER }}
      SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      SFTP_DELETE: ${{ vars.SFTP_DELETE || secrets.SFTP_DELETE }}
      FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || secrets.FTP_VERIFY_CERT }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      SFTP_KEY: ${{ secrets.SFTP_KEY }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepara il sito
        env:
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: scripts/build.sh "$SITE_URL" _site

      - name: Configura il modulo di iscrizione
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GOOGLE_SCRIPT_TOKEN: ${{ secrets.GOOGLE_SCRIPT_TOKEN }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
        run: scripts/config-modulo.sh _site/api/config.php "$SITE_URL"

      - name: Installa lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Carica i file
        run: scripts/pubblica-ftp.sh _site "$SFTP_REMOTE_DIR"
