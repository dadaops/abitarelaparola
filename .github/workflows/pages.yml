name: Pubblica su GitHub Pages

# Per spegnerlo senza modificare il file: variabile del repo PAGES_ENABLED=false.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: pages
        uses: actions/configure-pages@v5

      # L'indirizzo è quello di Pages: oggi https://dadaops.dev/abitarelaparola,
      # dopo il collegamento del dominio https://abitarelaparola.it.
      - name: Prepara il sito
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/build.sh "https://${BASE_URL#*://}" _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
